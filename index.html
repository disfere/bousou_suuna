<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>暴走スゥナ</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:sans-serif;
    color:white;
    overflow:hidden;
    background:black;
}

/* =========================
   背景動画
========================= */

#bgVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
    background:black;

    transition:opacity 1s;
}

#bgVideo.fadeOut{
    opacity:0;
}

#bgVideo.fadeIn{
    opacity:1;
}

/* =========================
   共通画面
========================= */

.screen{
    width:100vw;
    height:100vh;

    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:10px;

    text-align:center;
}

.active{
    display:flex;
}

/* =========================
   タイトル
========================= */

.title{
    font-size:36px;
    font-weight:bold;

    color:white;

    text-shadow:
        0 0 10px #ff00aa,
        0 0 20px #ff00aa,
        0 0 40px #ff00aa;

    margin-bottom:20px;
}

/* =========================
   ボタン
========================= */

button{
    width:180px;
    max-width:80vw;

    padding:10px;

    margin:6px;

    border:none;
    border-radius:12px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

/* =========================
   ターン表示
========================= */

#turnDisplay{

    font-size:22px;
    font-weight:bold;

    margin-bottom:12px;

    text-shadow:
        0 0 10px black;
}

/* =========================
   HP
========================= */

#hpText{
    font-size:22px;
    margin-bottom:8px;

    text-shadow:
        0 0 10px black;
}

#hpBarWrap{

    width:90%;
    max-width:500px;

    height:16px;

    background:#333;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:14px;
}

#hpBar{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff0066,
            #ff4444
        );

    transition:0.4s;
}

/* =========================
   ダメージ入力
========================= */

.damageArea{
    margin-bottom:10px;
}

.damageArea input{

    width:140px;

    padding:8px;

    font-size:18px;
    text-align:center;

    border:none;
    border-radius:10px;
}

.damageArea button{
    width:140px;
}

/* =========================
   ゲーム画面
========================= */

#gameScreen{
    justify-content:flex-end;
    padding-bottom:100px;
}

/* =========================
   降参ボタン
========================= */

#giveUpButton{

    position:fixed;

    top:12px;
    right:12px;

    width:90px;

    padding:8px;

    font-size:14px;

    z-index:50;

    background:
        rgba(0,0,0,0.55);

    color:white;

    border:
        1px solid white;
}

/* =========================
   ★ルーレットオーバーレイ
========================= */

#rouletteOverlay{

    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:
        rgba(0,0,0,0.45);

    z-index:997;
}

#roulette{

    width:100%;

    text-align:center;

    font-size:64px;
    font-weight:bold;

    text-shadow:
        0 0 10px white,
        0 0 20px white,
        0 0 40px white;
}

/* =========================
   技カットイン
========================= */

#cutinOverlay{

    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:
        rgba(0,0,0,0.72);

    z-index:998;

    animation:
        fadeCutin 1.2s ease;
}

#cutinText{

    width:90%;

    text-align:center;

    font-size:42px;
    font-weight:bold;

    line-height:1.5;

    color:white;

    text-shadow:
        0 0 10px #ff00aa,
        0 0 20px #ff00aa,
        0 0 40px #ff00aa;

    animation:
        cutinZoom 1.2s ease;
}

/* =========================
   技オーバーレイ
========================= */

#skillOverlay{

    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:
        rgba(0,0,0,0.6);

    z-index:999;
}

#overlayCard{

    width:90%;
    max-width:520px;

    background:
        rgba(20,20,20,0.92);

    border:
        2px solid white;

    border-radius:24px;

    padding:24px;

    text-align:center;

    animation:
        popup 0.25s ease;
}

#overlaySkillName{

    font-size:30px;
    font-weight:bold;

    margin-bottom:14px;
}

#overlaySkillDamage{

    font-size:24px;

    margin-bottom:14px;
}

#overlaySkillEffect{

    font-size:16px;

    line-height:1.6;

    margin-bottom:20px;
}

/* =========================
   リザルト
========================= */

.resultTitle{
    font-size:40px;
    margin-bottom:20px;
}

.resultText{
    font-size:22px;
    margin:8px;
}

/* =========================
   FAILED
========================= */

.failedTitle{

    font-size:64px;
    font-weight:bold;

    color:white;

    letter-spacing:6px;

    text-shadow:
        0 0 20px red,
        0 0 40px red;

    margin-bottom:40px;

    animation:
        failedFade 1.2s ease;
}

/* =========================
   アニメ
========================= */

@keyframes popup{

    from{
        transform:scale(0.85);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

@keyframes fadeCutin{

    0%{
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}

@keyframes cutinZoom{

    0%{
        transform:scale(0.7);
        opacity:0;
    }

    20%{
        transform:scale(1.05);
        opacity:1;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

@keyframes failedFade{

    from{
        opacity:0;
        transform:scale(1.2);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

@media(max-width:700px){

    .title{
        font-size:30px;
    }

    button{
        font-size:16px;
    }

    #cutinText{
        font-size:30px;
    }

    #roulette{
        font-size:44px;
    }

}

</style>
</head>

<body>

<!-- 背景動画 -->
<video autoplay muted loop playsinline id="bgVideo" class="fadeIn">
    <source src="suuna_loop.mp4" type="video/mp4">
</video>

<!-- タイトル -->
<div id="titleScreen" class="screen active">

    <div class="title">
        暴走スゥナ
    </div>

    <button onclick="showDifficulty()">
        ゲームスタート
    </button>

    <button onclick="showRules()">
        ルール説明
    </button>

</div>

<!-- ルール -->
<div id="ruleScreen" class="screen">

    <h1>ルール説明</h1>

    <p>
        暴走スゥナを協力して倒せ！
    </p>

    <p>
        Ver 0.2.2
    </p>

    <button onclick="backToTitle()">
        タイトルへ戻る
    </button>

</div>

<!-- 難易度 -->
<div id="difficultyScreen" class="screen">

    <h1>人数選択</h1>

    <button onclick="startGame(1)">
        1人用
    </button>

    <button onclick="startGame(2)">
        2人用
    </button>

</div>

<!-- ゲーム -->
<div id="gameScreen" class="screen">

    <!-- 降参 -->
    <button
        id="giveUpButton"
        onclick="showFailed()">

        降参

    </button>

    <div id="turnDisplay">
        プレイヤーターン
    </div>

    <div id="hpText">
        HP 3000 / 3000
    </div>

    <div id="hpBarWrap">
        <div id="hpBar"></div>
    </div>

    <!-- プレイヤー -->
    <div id="playerArea">

        <div class="damageArea">

            <input
                type="text"
                id="damageInput"
                placeholder="ダメージ">

            <br>

            <button onclick="applyDamage()">
                ダメージ反映
            </button>

        </div>

        <button onclick="endPlayerTurn()">
            ターン終了
        </button>

    </div>

    <!-- 敵 -->
    <div id="enemyArea" style="display:none;">

        <button
            id="enemyActionButton"
            onclick="enemyAction()">

            スゥナの攻撃

        </button>

        <button
            id="enemySkipButton"
            onclick="endEnemyTurn()"
            style="display:none;">

            何もしない

        </button>

    </div>

</div>

<!-- ★ルーレット -->
<div id="rouletteOverlay">

    <div id="roulette">
        ★☆☆☆☆☆
    </div>

</div>

<!-- 技カットイン -->
<div id="cutinOverlay">

    <div id="cutinText">
        ---
    </div>

</div>

<!-- 技オーバーレイ -->
<div id="skillOverlay">

    <div id="overlayCard">

        <div id="overlaySkillName">
            ---
        </div>

        <div id="overlaySkillDamage">
            ---
        </div>

        <div id="overlaySkillEffect">
            ---
        </div>

        <button onclick="closeSkillOverlay()">
            OK
        </button>

    </div>

</div>

<!-- リザルト -->
<div id="resultScreen" class="screen">

    <div class="resultTitle">
        RESULT
    </div>

    <div class="resultText" id="maxDamageText">
        最大ダメージ：0
    </div>

    <div class="resultText" id="turnText">
        ターン数：0
    </div>

    <button onclick="backToTitle()">
        タイトルに戻る
    </button>

</div>

<!-- FAILED -->
<div id="failedScreen" class="screen">

    <div class="failedTitle">
        FAILED
    </div>

    <button onclick="backToTitle()">
        タイトルに戻る
    </button>

</div>

<script>

/* =========================
   データ
========================= */

let gameMode = 1;

let maxHp = 3000;
let hp = 3000;

let turnCount = 1;

let currentSide = "player";

let currentPlayer = "先";

let maxDamage = 0;

/* =========================
   ワザ
========================= */

const skills = {

    1:[
        {
            name:"どうして止めるの？",
            damage:70,
            effect:"ベンチポケモン１匹にダメカン３個のせる。（どのポケモンにするかはプレイヤーが選んでよい。）"
        },
        {
            name:"まだ遊べるよね？",
            damage:50,
            effect:"このワザを受けたプレイヤーは手札を１枚選び、トラッシュする。"
        },
        {
            name:"そんな顔しないで",
            damage:100,
            effect:"追加効果なし"
        }
    ],

    2:[
        {
            name:"あなたも欲しいの？",
            damage:30,
            effect:"攻撃を受けるプレイヤーの場のエネルギーの数×30ダメージ追加。"
        },
        {
            name:"寂しいんだね",
            damage:30,
            effect:"攻撃を受けるプレイヤーの場のポケモンの数×30ダメージ追加。"
        },
        {
            name:"そんなにいらないよ",
            damage:30,
            effect:"攻撃を受けるプレイヤーの手札の枚数×30ダメージ追加。"
        }
    ],

    3:[
        {
            name:"ぜんぶ引けば解決するよ？",
            damage:130,
            effect:"すべてのプレイヤーは手札をウラにして切り山札の下にもどす。その後、山札を５枚ひく。"
        }
    ],

    4:[
        {
            name:"まだ終われないよ",
            damage:180,
            effect:"このワザを２回使う。（いわゆる「おまつりおんど」）"
        }
    ],

    5:[
        {
            name:"あなたは選ばれたんだよ",
            damage:250,
            effect:"このワザを受けたプレイヤーはコインを投げる。おもてならベンチポケモンすべてに150ダメージ。"
        }
    ],

    6:[
        {
            name:"その一枚が、終わりになる",
            damage:350,
            effect:"このワザを受けたプレイヤーは手札をすべてトラッシュする。その後、山札を１枚ひく。"
        }
    ]

};

/* =========================
   背景動画切替
========================= */

function changeBackgroundVideo(fileName){

    const video =
        document.getElementById("bgVideo");

    video.style.display = "block";

    video.classList.remove("fadeIn");
    video.classList.add("fadeOut");

    setTimeout(()=>{

        video.pause();

        video.innerHTML =
            `<source src="${fileName}" type="video/mp4">`;

        video.load();

        video.play();

        video.classList.remove("fadeOut");
        video.classList.add("fadeIn");

    },1000);

}

/* =========================
   技カットイン
========================= */

function showCutin(skillName, callback){

    const overlay =
        document.getElementById(
            "cutinOverlay"
        );

    const text =
        document.getElementById(
            "cutinText"
        );

    text.innerText =
        skillName;

    overlay.style.display =
        "flex";

    setTimeout(()=>{

        overlay.style.display =
            "none";

        callback();

    },1200);

}

/* =========================
   画面切替
========================= */

function hideAllScreens(){

    document.querySelectorAll(".screen")
    .forEach(screen=>{
        screen.classList.remove("active");
    });

}

function backToTitle(){

    const video =
        document.getElementById(
            "bgVideo"
        );

    video.style.display = "block";

    changeBackgroundVideo("suuna_loop.mp4");

    hideAllScreens();

    document
    .getElementById("titleScreen")
    .classList.add("active");

}

function showRules(){

    hideAllScreens();

    document
    .getElementById("ruleScreen")
    .classList.add("active");

}

function showDifficulty(){

    hideAllScreens();

    document
    .getElementById("difficultyScreen")
    .classList.add("active");

}

/* =========================
   ゲーム開始
========================= */

function startGame(mode){

    gameMode = mode;

    if(mode === 1){

        maxHp = 1500;

    }else{

        maxHp = 3000;

    }

    hp = maxHp;

    turnCount = 1;

    currentSide = "player";

    currentPlayer = "先";

    maxDamage = 0;

    updateHpBar();

    updateTurnUI();

    hideAllScreens();

    document
    .getElementById("gameScreen")
    .classList.add("active");

}

/* =========================
   HP更新
========================= */

function updateHpBar(){

    document.getElementById("hpText")
    .innerText =
        `HP ${hp} / ${maxHp}`;

    const percent =
        (hp / maxHp) * 100;

    document.getElementById("hpBar")
    .style.width =
        percent + "%";

}

/* =========================
   ターンUI
========================= */

function updateTurnUI(){

    const playerArea =
        document.getElementById(
            "playerArea"
        );

    const enemyArea =
        document.getElementById(
            "enemyArea"
        );

    const enemyActionButton =
        document.getElementById(
            "enemyActionButton"
        );

    const enemySkipButton =
        document.getElementById(
            "enemySkipButton"
        );

    const turnDisplay =
        document.getElementById(
            "turnDisplay"
        );

    if(currentSide === "player"){

        playerArea.style.display =
            "block";

        enemyArea.style.display =
            "none";

        if(gameMode === 1){

            turnDisplay.innerText =
                `プレイヤーターン（${turnCount}ターン目）`;

        }else{

            turnDisplay.innerText =
                `${currentPlayer}攻ターン（${turnCount}ターン目）`;

        }

    }else{

        playerArea.style.display =
            "none";

        enemyArea.style.display =
            "block";

        let noAttack = false;

        if(turnCount === 1){

            noAttack = true;

        }

        if(noAttack){

            enemyActionButton.style.display =
                "none";

            enemySkipButton.style.display =
                "inline-block";

        }else{

            enemyActionButton.style.display =
                "inline-block";

            enemySkipButton.style.display =
                "none";

        }

        if(gameMode === 1){

            turnDisplay.innerText =
                `スゥナターン（${turnCount}ターン目）`;

        }else{

            turnDisplay.innerText =
                `スゥナターン（${currentPlayer}${turnCount}ターン目）`;

        }

    }

}

/* =========================
   プレイヤー終了
========================= */

function endPlayerTurn(){

    currentSide = "enemy";

    updateTurnUI();

}

/* =========================
   敵終了
========================= */

function endEnemyTurn(){

    if(gameMode === 1){

        turnCount++;

    }else{

        if(currentPlayer === "先"){

            currentPlayer = "後";

        }else{

            currentPlayer = "先";
            turnCount++;

        }

    }

    currentSide = "player";

    updateTurnUI();

}

/* =========================
   敵行動
========================= */

function enemyAction(){

    document.getElementById(
        "rouletteOverlay"
    ).style.display = "flex";

    const roulette =
        document.getElementById("roulette");

    let count = 0;

    const interval = setInterval(()=>{

        const star =
            Math.floor(Math.random()*6)+1;

        roulette.innerText =
            "★".repeat(star)

        count++;

        if(count >= 20){

            clearInterval(interval);

            let starPool = [];

            const hpRate = hp / maxHp;

            if(hpRate >= 0.7){

                starPool = [
                    1,1,1,1,
                    2,2,2,
                    3
                ];

            }
            else if(hpRate >= 0.4){

                starPool = [
                    2,2,
                    3,3,
                    4,4,
                    5
                ];

            }
            else{

                starPool = [
                    3,
                    4,4,
                    5,5,
                    6,6
                ];

            }

            const finalStar =
                starPool[
                    Math.floor(
                        Math.random()
                        * starPool.length
                    )
                ];

            roulette.innerText =
                "★".repeat(finalStar)

            setTimeout(()=>{

                document.getElementById(
                    "rouletteOverlay"
                ).style.display = "none";

                showSkill(finalStar);

            },500);

        }

    },100);

}

/* =========================
   ワザ表示
========================= */

function showSkill(level){

    const list = skills[level];

    const skill =
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];

    document.getElementById(
        "overlaySkillName"
    ).innerText =
        skill.name;

    document.getElementById(
        "overlaySkillDamage"
    ).innerText =
        skill.damage + " ダメージ";

    document.getElementById(
        "overlaySkillEffect"
    ).innerText =
        skill.effect;

    showCutin(skill.name, ()=>{

        document.getElementById(
            "skillOverlay"
        ).style.display = "flex";

    });

}

/* =========================
   オーバーレイ閉じる
========================= */

function closeSkillOverlay(){

    document.getElementById(
        "skillOverlay"
    ).style.display = "none";

    endEnemyTurn();

}

/* =========================
   ダメージ
========================= */

function applyDamage(){

    const input =
        document.getElementById(
            "damageInput"
        );

    const text =
        input.value;

    const damage =
        parseInt(text);

    if(isNaN(damage) || damage <= 0){
        return;
    }

    hp -= damage;

    if(hp < 0){
        hp = 0;
    }

    if(damage > maxDamage){
        maxDamage = damage;
    }

    updateHpBar();

    input.value = "";

    if(hp <= 0){

        showResult();

    }

}

/* =========================
   FAILED
========================= */

function showFailed(){

    changeBackgroundVideo(
        "suuna_failed.mp4"
    );

    setTimeout(()=>{

        hideAllScreens();

        document
        .getElementById(
            "failedScreen"
        )
        .classList.add("active");

    },1000);

}

/* =========================
   リザルト
========================= */

function showResult(){

    changeBackgroundVideo(
        "suuna_clear.mp4"
    );

    hideAllScreens();

    document
    .getElementById("resultScreen")
    .classList.add("active");

    document
    .getElementById("maxDamageText")
    .innerText =
        "最大ダメージ：" + maxDamage;

    document
    .getElementById("turnText")
    .innerText =
        "ターン数：" + (turnCount - 1);

}

</script>

</body>
</html>
