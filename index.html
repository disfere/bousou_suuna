<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>暴走スゥナ</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:sans-serif;
    color:white;
    overflow:hidden;
    background:black;
}

/* =========================
   背景動画
========================= */

#bgVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
    background:black;
}

/* =========================
   共通画面
========================= */

.screen{
    width:100vw;
    height:100vh;

    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:15px;

    text-align:center;
}

.active{
    display:flex;
}

/* =========================
   タイトル
========================= */

.title{
    font-size:52px;
    font-weight:bold;

    color:white;

    text-shadow:
        0 0 10px #ff00aa,
        0 0 20px #ff00aa,
        0 0 40px #ff00aa;

    margin-bottom:30px;
}

/* =========================
   ボタン
========================= */

button{
    width:260px;
    max-width:80vw;

    padding:16px;

    margin:10px;

    border:none;
    border-radius:18px;

    font-size:24px;
    font-weight:bold;

    cursor:pointer;
}

/* =========================
   HP
========================= */

#hpText{
    font-size:30px;
    margin-bottom:10px;

    text-shadow:
        0 0 10px black;
}

#hpBarWrap{

    width:90%;
    max-width:600px;

    height:24px;

    background:#333;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:20px;
}

#hpBar{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff0066,
            #ff4444
        );

    transition:0.4s;
}

/* =========================
   ダメージ入力
========================= */

.damageArea{
    margin-bottom:15px;
}

.damageArea input{

    width:180px;

    padding:12px;

    font-size:28px;
    text-align:center;

    border:none;
    border-radius:12px;
}

.damageArea button{
    width:180px;
}

/* =========================
   敵行動
========================= */

#enemyButton{
    margin-top:0;
    margin-bottom:15px;
}

/* =========================
   ★ルーレット
========================= */

#roulette{

    font-size:42px;
    font-weight:bold;

    margin-bottom:20px;

    min-height:60px;

    text-shadow:
        0 0 10px white,
        0 0 20px white;
}

/* =========================
   ワザ表示
========================= */

#skillBox{

    width:92%;
    max-width:700px;

    background:
        rgba(0,0,0,0.55);

    border:
        3px solid white;

    border-radius:20px;

    padding:15px;

    backdrop-filter: blur(4px);
}

#skillName{

    font-size:34px;
    font-weight:bold;

    margin-bottom:15px;
}

#skillDamage{

    font-size:28px;

    margin-bottom:15px;
}

#skillEffect{

    font-size:18px;

    line-height:1.6;
}

/* =========================
   リザルト
========================= */

.resultTitle{
    font-size:52px;
    margin-bottom:30px;
}

.resultText{
    font-size:28px;
    margin:10px;
}

/* =========================
   スマホ
========================= */

@media(max-width:700px){

    .title{
        font-size:42px;
    }

    button{
        font-size:22px;
    }

    #skillName{
        font-size:28px;
    }

    #skillDamage{
        font-size:24px;
    }

}

</style>
</head>

<body>

<!-- 背景動画 -->
<video autoplay muted loop playsinline id="bgVideo">
    <source src="suuna_loop.mp4" type="video/mp4">
</video>

<!-- =========================
     タイトル
========================= -->

<div id="titleScreen" class="screen active">

    <div class="title">
        暴走スゥナ
    </div>

    <button onclick="showDifficulty()">
        ゲームスタート
    </button>

    <button onclick="showRules()">
        ルール説明
    </button>

</div>

<!-- =========================
     ルール
========================= -->

<div id="ruleScreen" class="screen">

    <h1>ルール説明</h1>

    <p>
        暴走スゥナの攻撃に耐えながら、<br>
        協力してHPを削り切れ！
    </p>

    <p>
        HPが減るほど、
        危険なワザが出やすくなる！
    </p>

    <p>
        Ver 0.1.0
    </p>

    <button onclick="backToTitle()">
        タイトルへ戻る
    </button>

</div>

<!-- =========================
     難易度
========================= -->

<div id="difficultyScreen" class="screen">

    <h1>人数選択</h1>

    <button onclick="startGame(1500)">
        1人用（HP1500）
    </button>

    <button onclick="startGame(3000)">
        2人用（HP3000）
    </button>

</div>

<!-- =========================
     ゲーム画面
========================= -->

<div id="gameScreen" class="screen">

    <!-- HP -->
    <div id="hpText">
        HP 3000 / 3000
    </div>

    <div id="hpBarWrap">
        <div id="hpBar"></div>
    </div>

    <!-- ダメージ入力 -->
    <div class="damageArea">

        <input
            type="number"
            id="damageInput"
            placeholder="ダメージ">

        <br>

        <button onclick="applyDamage()">
            OK
        </button>

    </div>

    <!-- 敵行動 -->
    <button
        id="enemyButton"
        onclick="enemyAction()">

        敵の行動

    </button>

    <!-- ★ -->
    <div id="roulette">
        ★☆☆☆☆☆
    </div>

    <!-- ワザ表示 -->
    <div id="skillBox">

        <div id="skillName">
            ---
        </div>

        <div id="skillDamage">
            ---
        </div>

        <div id="skillEffect">
            ---
        </div>

    </div>

</div>

<!-- =========================
     リザルト
========================= -->

<div id="resultScreen" class="screen">

    <div class="resultTitle">
        RESULT
    </div>

    <div class="resultText" id="maxDamageText">
        最大ダメージ：0
    </div>

    <div class="resultText" id="turnText">
        ターン数：0
    </div>

    <button onclick="backToTitle()">
        タイトルに戻る
    </button>

</div>

<script>

/* =========================
   データ
========================= */

let maxHp = 3000;
let hp = 3000;

let turnCount = 0;
let maxDamage = 0;

/* =========================
   ワザデータ
========================= */

const skills = {

    1:[
        {
            name:"どうして止めるの？",
            damage:100,
            effect:"ベンチポケモンにも30ダメージ（どのポケモンにするかはプレイヤーが選んでよい。）"
        }
    ],

    2:[
        {
            name:"あなたも欲しいんでしょう？",
            damage:40,
            effect:"攻撃を受けるプレイヤーの場のエネルギーの数×40ダメージ。"
        }
    ],

    3:[
        {
            name:"ぜんぶ引けば解決するよ？",
            damage:130,
            effect:"すべてのプレイヤーは手札をウラにして切り山札の下にもどす。その後、山札を５枚ひく。"
        }
    ],

    4:[
        {
            name:"まだ終われないよ",
            damage:180,
            effect:"このワザを２回使う。（いわゆる「おまつりおんど」）"
        }
    ],

    5:[
        {
            name:"あなたは選ばれたんだよ",
            damage:250,
            effect:"このワザを受けたプレイヤーはコインを投げる。おもてならベンチポケモンすべてに150ダメージ。"
        }
    ],

    6:[
        {
            name:"その一枚が、終わりになる",
            damage:350,
            effect:"このワザを受けたプレイヤーは手札をすべてトラッシュする。その後、山札を１枚ひく。"
        }
    ]

};

/* =========================
   画面切替
========================= */

function hideAllScreens(){

    document.querySelectorAll(".screen")
    .forEach(screen=>{
        screen.classList.remove("active");
    });

}

function backToTitle(){

    hideAllScreens();

    document
    .getElementById("titleScreen")
    .classList.add("active");

}

function showRules(){

    hideAllScreens();

    document
    .getElementById("ruleScreen")
    .classList.add("active");

}

function showDifficulty(){

    hideAllScreens();

    document
    .getElementById("difficultyScreen")
    .classList.add("active");

}

/* =========================
   ゲーム開始
========================= */

function startGame(startHp){

    maxHp = startHp;
    hp = startHp;

    turnCount = 0;
    maxDamage = 0;

    updateHpBar();

    hideAllScreens();

    document
    .getElementById("gameScreen")
    .classList.add("active");

}

/* =========================
   HP更新
========================= */

function updateHpBar(){

    document.getElementById("hpText")
    .innerText =
        `HP ${hp} / ${maxHp}`;

    const percent =
        (hp / maxHp) * 100;

    document.getElementById("hpBar")
    .style.width =
        percent + "%";

}

/* =========================
   敵行動
========================= */

function enemyAction(){

    const roulette =
        document.getElementById("roulette");

    let count = 0;

    const interval = setInterval(()=>{

        const star =
            Math.floor(Math.random()*6)+1;

        roulette.innerText =
            "★".repeat(star) +
            "☆".repeat(6-star);

        count++;

        if(count >= 20){

            clearInterval(interval);

            let starPool = [];

            const hpRate = hp / maxHp;

            /* =========================
               HP割合で危険度変化
            ========================= */

            if(hpRate >= 0.7){

                starPool = [
                    1,1,1,1,
                    2,2,2,
                    3
                ];

            }
            else if(hpRate >= 0.4){

                starPool = [
                    2,2,
                    3,3,
                    4,4,
                    5
                ];

            }
            else{

                starPool = [
                    3,
                    4,4,
                    5,5,
                    6,6
                ];

            }

            const finalStar =
                starPool[
                    Math.floor(
                        Math.random()
                        * starPool.length
                    )
                ];

            roulette.innerText =
                "★".repeat(finalStar) +
                "☆".repeat(6-finalStar);

            showSkill(finalStar);

        }

    },100);

}

/* =========================
   ワザ表示
========================= */

function showSkill(level){

    const list = skills[level];

    const skill =
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];

    document.getElementById("skillName")
    .innerText =
        skill.name;

    document.getElementById("skillDamage")
    .innerText =
        skill.damage + " ダメージ";

    document.getElementById("skillEffect")
    .innerText =
        skill.effect;

}

/* =========================
   ダメージ
========================= */

function applyDamage(){

    const input =
        document.getElementById("damageInput");

    const damage =
        Number(input.value);

    if(!damage || damage <= 0){
        return;
    }

    hp -= damage;

    if(hp < 0){
        hp = 0;
    }

    turnCount++;

    if(damage > maxDamage){
        maxDamage = damage;
    }

    updateHpBar();

    input.value = "";

    if(hp <= 0){

        showResult();

    }

}

/* =========================
   リザルト
========================= */

function showResult(){

    hideAllScreens();

    document
    .getElementById("resultScreen")
    .classList.add("active");

    document
    .getElementById("maxDamageText")
    .innerText =
        "最大ダメージ：" + maxDamage;

    document
    .getElementById("turnText")
    .innerText =
        "ターン数：" + turnCount;

}

</script>

</body>
</html>
