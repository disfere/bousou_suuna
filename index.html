<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>暴走スゥナ</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:sans-serif;
    color:white;
    overflow:hidden;
    background:black;
}

/* =========================
   背景動画
========================= */

#bgVideo{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-1;

    background:black;

    transition:opacity 1s;
}

.fadeOut{
    opacity:0;
}

.fadeIn{
    opacity:1;
}

/* =========================
   共通画面
========================= */

.screen{
    width:100vw;
    height:100vh;

    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:10px;

    text-align:center;
}

.active{
    display:flex;
}

/* =========================
   タイトル
========================= */

.title{
    font-size:40px;
    font-weight:bold;

    text-shadow:
        0 0 10px #ff00aa,
        0 0 20px #ff00aa;

    margin-bottom:20px;
}

/* =========================
   ボタン
========================= */

button{
    width:180px;
    max-width:70vw;

    padding:10px;

    margin:6px;

    border:none;
    border-radius:14px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

/* =========================
   HP
========================= */

#hpText{
    font-size:20px;

    margin-bottom:8px;

    text-shadow:
        0 0 10px black;
}

#hpBarWrap{

    width:80%;
    max-width:450px;

    height:14px;

    background:#333;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:15px;
}

#hpBar{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff0066,
            #ff4444
        );

    transition:0.4s;
}

/* =========================
   ダメージ入力
========================= */

.damageArea{
    margin-bottom:10px;
}

.damageArea input{

    width:120px;

    padding:8px;

    font-size:18px;

    text-align:center;

    border:none;
    border-radius:10px;
}

.damageArea button{
    width:100px;
}

/* =========================
   敵行動
========================= */

#enemyButton{
    margin-bottom:10px;
}

/* =========================
   ★ルーレット
========================= */

#roulette{

    font-size:32px;
    font-weight:bold;

    margin-bottom:10px;

    min-height:45px;

    text-shadow:
        0 0 10px white;
}

/* =========================
   ワザオーバーレイ
========================= */

#skillOverlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:
        rgba(0,0,0,0.55);

    z-index:10;
}

#skillOverlay.active{
    display:flex;
}

#skillBox{

    width:88%;
    max-width:500px;

    background:
        rgba(0,0,0,0.75);

    border:
        2px solid white;

    border-radius:20px;

    padding:18px;

    text-align:center;

    backdrop-filter: blur(4px);
}

#skillName{

    font-size:28px;
    font-weight:bold;

    margin-bottom:12px;
}

#skillDamage{

    font-size:22px;

    margin-bottom:12px;
}

#skillEffect{

    font-size:15px;

    line-height:1.5;

    opacity:0.9;

    margin-bottom:18px;
}

/* =========================
   リザルト
========================= */

.resultTitle{
    font-size:40px;
    margin-bottom:20px;
}

.resultText{
    font-size:22px;
    margin:8px;
}

/* =========================
   スマホ
========================= */

@media(max-width:700px){

    .title{
        font-size:34px;
    }

    button{
        font-size:16px;
    }

}

</style>
</head>

<body>

<!-- 背景動画 -->
<video
    autoplay
    muted
    loop
    playsinline
    id="bgVideo"
    class="fadeIn">

    <source
        src="suuna_loop.mp4"
        type="video/mp4">

</video>

<!-- =========================
     タイトル
========================= -->

<div id="titleScreen" class="screen active">

    <div class="title">
        暴走スゥナ
    </div>

    <button onclick="showDifficulty()">
        ゲームスタート
    </button>

    <button onclick="showRules()">
        ルール説明
    </button>

</div>

<!-- =========================
     ルール
========================= -->

<div id="ruleScreen" class="screen">

    <h2>ルール説明</h2>

    <p>
        暴走スゥナを倒せ！
    </p>

    <p>
        HPが減るほど
        危険なワザが増加！
    </p>

    <p>
        Ver 0.1.2
    </p>

    <button onclick="backToTitle()">
        タイトルへ戻る
    </button>

</div>

<!-- =========================
     難易度
========================= -->

<div id="difficultyScreen" class="screen">

    <h2>人数選択</h2>

    <button onclick="startGame(1500)">
        1人用
    </button>

    <button onclick="startGame(3000)">
        2人用
    </button>

</div>

<!-- =========================
     ゲーム
========================= -->

<div id="gameScreen" class="screen">

    <!-- HP -->
    <div id="hpText">
        HP 3000 / 3000
    </div>

    <div id="hpBarWrap">
        <div id="hpBar"></div>
    </div>

    <!-- ダメージ -->
    <div class="damageArea">

        <input
            type="number"
            id="damageInput"
            placeholder="ダメージ">

        <br>

        <button onclick="applyDamage()">
            OK
        </button>

    </div>

    <!-- 敵行動 -->
    <button
        id="enemyButton"
        onclick="enemyAction()">

        敵の行動

    </button>

    <!-- ★ -->
    <div id="roulette">
        ★☆☆☆☆☆
    </div>

</div>

<!-- =========================
     ワザオーバーレイ
========================= -->

<div id="skillOverlay">

    <div id="skillBox">

        <div id="skillName">
            ---
        </div>

        <div id="skillDamage">
            ---
        </div>

        <div id="skillEffect">
            ---
        </div>

        <button onclick="closeSkillOverlay()">
            OK
        </button>

    </div>

</div>

<!-- =========================
     リザルト
========================= -->

<div id="resultScreen" class="screen">

    <div class="resultTitle">
        RESULT
    </div>

    <div class="resultText" id="maxDamageText">
        最大ダメージ：0
    </div>

    <div class="resultText" id="turnText">
        ターン数：0
    </div>

    <button onclick="backToTitle()">
        タイトルに戻る
    </button>

</div>

<script>

/* =========================
   データ
========================= */

let maxHp = 3000;
let hp = 3000;

let turnCount = 0;
let maxDamage = 0;

/* =========================
   ワザ
========================= */

const skills = {

    1:[
        {
            name:"狂気ノ爪",
            damage:100,
            effect:"追加効果なし"
        }
    ],

    2:[
        {
            name:"歪曲ノ波動",
            damage:180,
            effect:"次ターン回復量半減"
        }
    ],

    3:[
        {
            name:"暴走連撃",
            damage:250,
            effect:"追加50ダメージ"
        }
    ],

    4:[
        {
            name:"崩壊ノ叫ビ",
            damage:350,
            effect:"状態異常付与"
        }
    ],

    5:[
        {
            name:"終焉ノ断罪",
            damage:500,
            effect:"特殊エネルギー無効"
        }
    ],

    6:[
        {
            name:"暴走因子解放",
            damage:700,
            effect:"敵ダメージ+200"
        }
    ]

};

/* =========================
   背景変更
========================= */

function changeBackgroundVideo(fileName){

    const video =
        document.getElementById("bgVideo");

    video.classList.remove("fadeIn");
    video.classList.add("fadeOut");

    setTimeout(()=>{

        video.pause();

        video.innerHTML =
            `<source src="${fileName}" type="video/mp4">`;

        video.load();

        video.play();

        video.classList.remove("fadeOut");
        video.classList.add("fadeIn");

    },1000);

}

/* =========================
   画面切替
========================= */

function hideAllScreens(){

    document.querySelectorAll(".screen")
    .forEach(screen=>{
        screen.classList.remove("active");
    });

}

function backToTitle(){

    changeBackgroundVideo(
        "suuna_loop.mp4"
    );

    hideAllScreens();

    document
    .getElementById("titleScreen")
    .classList.add("active");

}

function showRules(){

    hideAllScreens();

    document
    .getElementById("ruleScreen")
    .classList.add("active");

}

function showDifficulty(){

    hideAllScreens();

    document
    .getElementById("difficultyScreen")
    .classList.add("active");

}

/* =========================
   ゲーム開始
========================= */

function startGame(startHp){

    maxHp = startHp;
    hp = startHp;

    turnCount = 0;
    maxDamage = 0;

    updateHpBar();

    hideAllScreens();

    document
    .getElementById("gameScreen")
    .classList.add("active");

}

/* =========================
   HP更新
========================= */

function updateHpBar(){

    document.getElementById("hpText")
    .innerText =
        `HP ${hp} / ${maxHp}`;

    const percent =
        (hp / maxHp) * 100;

    document.getElementById("hpBar")
    .style.width =
        percent + "%";

}

/* =========================
   敵行動
========================= */

function enemyAction(){

    const roulette =
        document.getElementById("roulette");

    let count = 0;

    const interval = setInterval(()=>{

        const star =
            Math.floor(Math.random()*6)+1;

        roulette.innerText =
            "★".repeat(star) +
            "☆".repeat(6-star);

        count++;

        if(count >= 18){

            clearInterval(interval);

            let starPool = [];

            const hpRate = hp / maxHp;

            if(hpRate >= 0.7){

                starPool = [
                    1,1,1,1,
                    2,2,2,
                    3
                ];

            }
            else if(hpRate >= 0.4){

                starPool = [
                    2,2,
                    3,3,
                    4,4,
                    5
                ];

            }
            else{

                starPool = [
                    3,
                    4,4,
                    5,5,
                    6,6
                ];

            }

            const finalStar =
                starPool[
                    Math.floor(
                        Math.random()
                        * starPool.length
                    )
                ];

            roulette.innerText =
                "★".repeat(finalStar) +
                "☆".repeat(6-finalStar);

            showSkill(finalStar);

        }

    },80);

}

/* =========================
   ワザ表示
========================= */

function showSkill(level){

    const list = skills[level];

    const skill =
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];

    document.getElementById("skillName")
    .innerText =
        skill.name;

    document.getElementById("skillDamage")
    .innerText =
        skill.damage + " ダメージ";

    document.getElementById("skillEffect")
    .innerText =
        skill.effect;

    document
    .getElementById("skillOverlay")
    .classList.add("active");

}

function closeSkillOverlay(){

    document
    .getElementById("skillOverlay")
    .classList.remove("active");

}

/* =========================
   ダメージ
========================= */

function applyDamage(){

    const input =
        document.getElementById("damageInput");

    const damage =
        Number(input.value);

    if(!damage || damage <= 0){
        return;
    }

    hp -= damage;

    if(hp < 0){
        hp = 0;
    }

    turnCount++;

    if(damage > maxDamage){
        maxDamage = damage;
    }

    updateHpBar();

    input.value = "";

    if(hp <= 0){

        showResult();

    }

}

/* =========================
   リザルト
========================= */

function showResult(){

    changeBackgroundVideo(
        "suuna_clear.mp4"
    );

    hideAllScreens();

    document
    .getElementById("resultScreen")
    .classList.add("active");

    document
    .getElementById("maxDamageText")
    .innerText =
        "最大ダメージ：" + maxDamage;

    document
    .getElementById("turnText")
    .innerText =
        "ターン数：" + turnCount;

}

</script>

</body>
</html>
